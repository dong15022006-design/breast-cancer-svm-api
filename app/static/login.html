<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Đăng nhập — Breast Cancer SVM</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  background:linear-gradient(135deg,#667eea 0%,#764ba2 50%,#f093fb 100%);
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  padding:20px;
  -webkit-font-smoothing:antialiased;
}

.login-card{
  background:rgba(255,255,255,.98);
  backdrop-filter:blur(20px);
  border-radius:24px;
  padding:48px 40px;
  max-width:420px;width:100%;
  box-shadow:0 30px 80px rgba(0,0,0,.25);
  animation:slideUp .5s cubic-bezier(.68,-.55,.27,1.55);
}
@keyframes slideUp{0%{opacity:0;transform:translateY(30px)}100%{opacity:1;transform:none}}

.logo{
  text-align:center;font-size:64px;margin-bottom:16px;
  animation:float 3s ease-in-out infinite;
}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

h1{
  text-align:center;
  font-size:26px;font-weight:800;letter-spacing:-.5px;
  background:linear-gradient(135deg,#667eea,#764ba2);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  margin-bottom:8px;
}
.subtitle{text-align:center;color:#718096;font-size:14px;margin-bottom:32px}

.field{margin-bottom:20px}
.field label{
  display:block;font-size:13px;font-weight:600;
  color:#4a5568;margin-bottom:8px;
}
.field input{
  width:100%;padding:14px 16px;
  border:2px solid #e2e8f0;border-radius:12px;
  font-size:15px;font-family:inherit;
  background:#f7fafc;
  transition:all .2s;
}
.field input:focus{
  outline:none;border-color:#667eea;
  background:#fff;
  box-shadow:0 0 0 4px rgba(102,126,234,.15);
}

.btn-login{
  width:100%;padding:16px;
  background:linear-gradient(135deg,#667eea,#764ba2);
  color:#fff;border:none;border-radius:12px;
  font-size:16px;font-weight:700;font-family:inherit;
  cursor:pointer;
  transition:all .3s;
  box-shadow:0 8px 24px rgba(102,126,234,.35);
  display:flex;align-items:center;justify-content:center;gap:10px;
}
.btn-login:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 12px 32px rgba(102,126,234,.5)}
.btn-login:disabled{opacity:.7;cursor:not-allowed}

.spinner{
  width:18px;height:18px;
  border:2px solid rgba(255,255,255,.3);
  border-top-color:#fff;border-radius:50%;
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

.error{
  background:#fff5f5;border:2px solid #f56565;
  border-radius:10px;padding:12px 16px;
  color:#742a2a;font-size:13px;
  margin-bottom:20px;
  display:none;
  animation:shake .4s;
}
.error.show{display:block}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

.info{
  text-align:center;font-size:12px;color:#a0aec0;
  margin-top:24px;line-height:1.6;
}
.info strong{color:#4a5568}
</style>
</head>
<body>
<div class="login-card">
  <div class="logo">🩺</div>
  <h1>Breast Cancer SVM</h1>
  <p class="subtitle">Đăng nhập để tiếp tục</p>

  <div class="error" id="errorBox"></div>

  <form id="loginForm">
    <div class="field">
      <label>Tên đăng nhập</label>
      <input type="text" id="username" placeholder="admin" required autocomplete="username">
    </div>
    <div class="field">
      <label>Mật khẩu</label>
      <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
    </div>
    <button type="submit" class="btn-login" id="submitBtn">
      <span id="btnContent">🔐 Đăng nhập</span>
    </button>
  </form>

  <p class="info">
    Demo giáo dục · <strong>Không</strong> thay thế chẩn đoán y khoa<br>
    Powered by FastAPI + SVM
  </p>
</div>

<script>
const API = window.location.origin;

document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("submitBtn");
  const btnContent = document.getElementById("btnContent");
  const errorBox = document.getElementById("errorBox");
  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value;

  btn.disabled = true;
  btnContent.innerHTML = '<div class="spinner"></div> Đang đăng nhập...';
  errorBox.classList.remove("show");

  try {
    const res = await fetch(`${API}/login`, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      credentials: "include",
      body: JSON.stringify({username, password})
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || "Đăng nhập thất bại");

    window.location.href = "/";
  } catch (err) {
    errorBox.textContent = "❌ " + err.message;
    errorBox.classList.add("show");
    btn.disabled = false;
    btnContent.innerHTML = "🔐 Đăng nhập";
  }
});
</script>
</body>
</html>
